version: '3.8'

services:
  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://postgres:secretpassword@db:5432/modern_space
      - LLM_PROVIDER=groq  # 'groq' သို့မဟုတ် 'gemini' ဟု ပြောင်းသုံးနိုင်သည်
      - GROQ_API_KEY=your_groq_api_key_here
      - GEMINI_API_KEY=your_gemini_api_key_here
      - MODEL_NAME=llama3-70b-8192  # သို့မဟုတ် gemini-1.5-pro
    depends_on:
      - db

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: modern_space
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: